[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-governance"
version = "0.1.0"
description = "Deterministic governance knowledge integrity engine for AI systems"
authors = [{name = "Tanishq Dasari", email = "tan@animuslab.dev"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "deepdiff>=7.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "pydantic>=2.0",
    "click>=8.0",
]

[project.scripts]
canon = "canon.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["canon*"]